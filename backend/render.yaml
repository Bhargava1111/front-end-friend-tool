# Render Blueprint — deploys PostgreSQL + Django API together (one click)
# https://render.com/docs/blueprint-spec
#
# Deploy:
#   Render Dashboard → New → Blueprint → connect this repo → Apply

databases:
  - name: mnxstore-db
    databaseName: mnxstore
    user: mnxstore
    plan: free
    ipAllowList: []

services:
  - type: web
    name: mnxstore-api
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: chmod +x start.sh && ./start.sh
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: mnxstore-db
          property: connectionString
      - key: POSTGRES_SSLMODE
        value: require
      - key: DB_CONN_MAX_AGE
        value: "600"
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://front-end-friend-tool.lovable.app,http://localhost:8080,http://127.0.0.1:8080
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: ENABLE_DEMO_OTP
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: ALLOW_DEMO_SEED
        value: "1"
