# Nginx — Sri Mahalakshmi Stores (web frontend + Django API)
# Installed to /etc/nginx/sites-available/mnxstore by install.sh

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream mnxstore_api {
    server unix:/run/mnxstore/gunicorn.sock fail_timeout=0;
    keepalive 16;
}

upstream mnxstore_web {
    server 127.0.0.1:3000 fail_timeout=0;
    keepalive 8;
}

server {
    listen 80 default_server;
    IPV6_LISTEN_PLACEHOLDER
    server_name SERVER_NAME_PLACEHOLDER;

    client_max_body_size 25M;
    send_timeout 300s;
    keepalive_timeout 75s;
    client_body_timeout 300s;
    client_header_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Lightweight health check — works even if Node/Django are restarting.
    location = /ping {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Django collected static files
    location /static/ {
        alias /var/www/mnxstore/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # User uploads
    location /media/ {
        alias /var/www/mnxstore/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Django REST API
    location /api/ {
        proxy_pass http://mnxstore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }

    # TanStack Start web app (Node/Nitro SSR)
    location / {
        proxy_pass http://mnxstore_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_buffering on;
        proxy_buffers 8 32k;
        proxy_buffer_size 32k;
        proxy_busy_buffers_size 64k;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
