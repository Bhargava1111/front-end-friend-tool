# Nginx site for Sri Mahalakshmi Stores API
# Installed to /etc/nginx/sites-available/mnxstore by install.sh

upstream mnxstore_api {
    server unix:/run/mnxstore/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME_PLACEHOLDER;

    client_max_body_size 25M;

    # Django collected static files
    location /static/ {
        alias /var/www/mnxstore/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # User uploads (product images, avatars, etc.)
    location /media/ {
        alias /var/www/mnxstore/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API + Django admin
    location / {
        proxy_pass http://mnxstore_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
